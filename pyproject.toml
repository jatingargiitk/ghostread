[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostread"
version = "0.1.0"
description = "Show text an AI agent reads on a web page that a human cannot see, and flag hidden instructions."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jatin Garg"}]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ghostread = "ghostread.cli:main"

[tool.setuptools]
packages = ["ghostread"]
